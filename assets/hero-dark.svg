<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Zeyu Chen: building the enterprise context layer</title>
<desc id="desc">Data sources such as telemetry, documents, databases, APIs and SaaS flow into an ontology-based context layer. AI agents reason over it to produce insights, recommendations and actions, and actions are written back to the source systems under governance.</desc>
<style>
.pulse{fill:none;stroke-linecap:round;stroke-dasharray:var(--d) 200;stroke-dashoffset:var(--d);opacity:0}
.in{animation:in 10s linear infinite both}
.to-agent{animation:toagent 10s linear infinite both}
.out{animation:out 10s linear infinite both}
.back{animation:back 10s linear infinite both}
.lit{opacity:0;animation:lit 10s ease-in-out infinite both}
.agent-lit{opacity:0;animation:agentlit 10s ease-in-out infinite both}
.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 10s ease-out infinite both}
.pill-lit{opacity:0;animation:pill 10s ease-in-out infinite both}
.src-lit{opacity:0;animation:src 10s ease-in-out infinite both}
.ants{stroke-dasharray:5 7;animation:ants 1.4s linear infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
@keyframes in{0%,1.00%{stroke-dashoffset:var(--d);opacity:0}1.50%{opacity:1}10.91%{stroke-dashoffset:-100;opacity:1}11.71%,100%{stroke-dashoffset:-100;opacity:0}}
@keyframes toagent{0%,20.91%{stroke-dashoffset:var(--d);opacity:0}21.41%{opacity:1}26.29%{stroke-dashoffset:-100;opacity:1}27.09%,100%{stroke-dashoffset:-100;opacity:0}}
@keyframes out{0%,30.29%{stroke-dashoffset:var(--d);opacity:0}30.79%{opacity:1}39.17%{stroke-dashoffset:-100;opacity:1}39.97%,100%{stroke-dashoffset:-100;opacity:0}}
@keyframes back{0%,49.17%{stroke-dashoffset:var(--d);opacity:0}49.67%{opacity:1}64.17%{stroke-dashoffset:-100;opacity:1}64.97%,100%{stroke-dashoffset:-100;opacity:0}}
@keyframes lit{0%,9.91%{opacity:0}14.91%{opacity:1}82.00%{opacity:1}91.00%,100%{opacity:0}}
@keyframes agentlit{0%,25.29%{opacity:0}30.29%{opacity:1}84.00%{opacity:1}93.00%,100%{opacity:0}}
@keyframes pill{0%,38.17%{opacity:0}43.17%{opacity:1}86.00%{opacity:1}95.00%,100%{opacity:0}}
@keyframes ring{0%,25.29%{opacity:0;transform:scale(1)}27.29%{opacity:.9;transform:scale(1)}40.29%{opacity:0;transform:scale(1.9)}100%{opacity:0}}
@keyframes src{0%,63.17%{opacity:0}66.17%{opacity:1}76.17%,100%{opacity:0}}
@keyframes ants{to{stroke-dashoffset:-24}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important}
  .pulse{opacity:0}
  .lit,.agent-lit,.pill-lit{opacity:1}
}
</style>
